<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SkyMoon - Remoção</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>SkyMoon S.A.</h1>
      <p>Remoção de funcionários</p>
    </header>

    <nav class="menu">
      <div class="menu-topo">
        <span class="menu-titulo">Menu</span>

        <button class="menu-botao" onclick="abrirFecharMenu()">☰</button>
      </div>

      <div class="menu-links" id="menuLinks">
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="listagem.html">Listagem</a>
        <a href="busca.html">Busca</a>
        <a href="atualizacao.html">Atualização</a>
        <a href="remocao.html">Remoção</a>
      </div>
    </nav>

    <main>
      <section class="card">
        <h2>Remover Funcionário</h2>

        <p class="info">Informe o ID do funcionário que será removido.</p>

        <div class="linha">
          <input type="number" id="deleteId" placeholder="ID do funcionário" />
          <button class="danger" onclick="removerFuncionario()">Remover</button>
        </div>

        <p id="mensagemRemocao" class="mensagem"></p>
      </section>

      <section class="card">
        <h2>Resultado</h2>

        <div id="resultado" class="resultado">Nenhuma remoção realizada.</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
